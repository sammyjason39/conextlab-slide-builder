services:
  conextlab-slide-builder:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: conextlab-slide-builder
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - OLLAMA_API_KEY=${OLLAMA_API_KEY}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-https://ollama.com/v1}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-glm-5.2:cloud}
    networks:
      - coolify
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.conextlab-chart-http.rule=Host(`chart.conextlab.ai`)"
      - "traefik.http.routers.conextlab-chart-http.entrypoints=http"
      - "traefik.http.routers.conextlab-chart-http.middlewares=redirect-to-https"
      - "traefik.http.routers.conextlab-chart.rule=Host(`chart.conextlab.ai`)"
      - "traefik.http.routers.conextlab-chart.entrypoints=https"
      - "traefik.http.routers.conextlab-chart.tls.certresolver=letsencrypt"
      - "traefik.http.services.conextlab-chart.loadbalancer.server.port=3000"

networks:
  coolify:
    external: true
